# NEKO 插件清单 —— 史莱姆牧场自动游玩
# 打包选择 package type = "plugin"（独立功能插件）
[plugin]
id = "slime_ranch_autopilot"
name = "史莱姆牧场自动游玩"
description = "让 NEKO 连接《史莱姆牧场》。默认观望，不操作游戏。按 V 键进入自主经营：从结晶市场出发，挨个围栏收结晶（收集器/地上），物品栏满立刻回市场按当日市价清仓再继续，直到没结晶；每轮间隔循环时间（默认30s，面板可改）。钱够费用两倍才建造或升级。"
version = "0.3.0"
entry = "plugin.plugins.slime_ranch_autopilot:SlimeRanchAutopilotPlugin"
type = "plugin"
author = "NEKO User"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true
startup_failure = "warn"
timeout = 60

[plugin.store]
enabled = true

[plugin.i18n]
default_locale = "zh"
locales_dir = "i18n"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "dashboard"
title = "控制台"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = ["state:read", "config:read", "action:call", "config:write", "logs:read"]

# ---------- 业务配置（本插件自定义 section，代码中可通过 self.config 读取） ----------
[slime_ranch]
# 语音模式下，玩家超过该秒数没有说话，则由 NEKO 自主接管游玩
timeout_seconds = 10
# 经营循环时间（秒，默认 30）：一轮完整循环 = 市场出发 → 挨个围栏收结晶（收集器/地上）
# → 物品栏满立刻回市场按当日市价清仓再继续 → 直到没结晶 → 回市场门口等待下一轮。
cycle_seconds = 30
# 默认模式：watch(观望，不操作) 或 ranch(自主经营)。按 V 键切换。
default_mode = "watch"
# 史莱姆牧场一代 exe。留空时核心会在常见 Steam 目录里找；找不到就不自动启动游戏。
game_exe = ""
# 是否在用户点「启动自动游玩」时自动启动游戏并进入最近存档（默认关闭：开插件总开关不会
# 自动拉起核心，也不会自动开游戏；打开这一项后，仍需手动点「启动自动游玩」才会生效）
auto_launch_game = false
# 留空则用启动 NEKO 的那个 Python。需要键鼠和截图依赖时，改成 setup.bat 建出的解释器。
engine_python = ""
# 后端：hybrid = 混合模式(SlimeBridge读状态/资金坐标 + 真实键鼠转向/走路/吸附 + 画面验证,推荐)；
#       ws    = 通过游戏内 SlimeBridge 桥接读状态/执行(最准但为瞬移式魔法操作,画面不动)；
#       live  = 真实键鼠控制(截图+模拟键鼠,需校准,汇报可能失真)；
#       sim   = 纯模拟(不碰游戏,用于演示验收)
# 建造/升级在自主经营里走游戏内真实 UI 购买(走到地块→开菜单→点按钮)，需要 mod 含
# scan_plot/scan_facilities/ui_buttons 新动作；旧的 build/upgrade 魔法接口不再被自主循环调用。
backend = "hybrid"
# SlimeBridge 服务地址(本机即可)。bridge_port 必须与 mod 的监听端口(HttpServer.DefaultPort=8124)一致，
# 这是 NEKO 插件与游戏 mod 之间唯一的接入口。
bridge_host = "127.0.0.1"
bridge_port = 8124
# 未安装 tesseract OCR / 读取资金失败时的兜底资金：-1=未知(不主动建造)；>=0 用该值推进自主游玩。
# 已安装 tesseract 并校准 money_region 后会自动读取真实资金，本值仅作保底。
live_fallback_funds = 1000
# live 校准（可选，未校准会退化为通用键盘操作）：
#   money_region = { "left":0.62, "top":0.02, "width":0.34, "height":0.07 } 资金区(0..1 窗内归一化)
#   btn_confirm/btn_sell_all/btn_home = [0.5, 0.75]  关键按钮屏内点(0..1 归一化)
calibration = {}